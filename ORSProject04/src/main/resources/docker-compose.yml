
services:
  mysql:
    image: mysql:8.0
    container_name: ORSProject4-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: p04

    ports:
      - "3308:3306"

    volumes:
      - ./mysql-data:/var/lib/mysql

    networks:
      - mynetwork

  webapp:
    build:
      context: .
      dockerfile: Dockerfile

    image: docker-webapp:latest
    container_name: ORSProject4-webapp
    restart: always

    ports:
      - "8080:8080"

    environment:
      JAVA_TOOL_OPTIONS: "-Denv=docker"

    depends_on:
      - mysql

    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge